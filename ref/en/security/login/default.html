jQuery.fn.preventDoubleSubmission = function () {
    $(this).on('submit', function (e) {
        var $form = $(this);

        if ($form.data('submitted') === true) {
                        e.preventDefault();
        } else {
                        $form.data('submitted', true);

            $(this).find(":submit").addClass('disabled');
            $(this).find(":submit").append('<i class="fa fa-spinner-third fa-spin fa-fw"></i>');
        }
    });

        return this;
};

var userDateFormat = 'yyyy-mm-dd';
var userDatePlaceholder = 'yyyy-mm-dd';
$('.input-group.date, .input-daterange, .datepicker').each(function() {
    var $input = $(this).find('input');
    var dateFormat = $input.data('date-format') || userDateFormat;
    var datePlaceholder = $input.data('date-placeholder') || userDatePlaceholder;
    if (datePlaceholder) {
        $input.attr('placeholder', datePlaceholder);
    }
    $(this).datepicker({
        todayBtn: 'linked',
        language: "en",
        todayHighlight: true,
        clearBtn: true,
        autoclose: true,
        format: dateFormat
    });
        var currentVal = $input.val();
    if (currentVal && dateFormat !== 'yyyy-mm-dd' && /^\d{4}-\d{2}-\d{2}$/.test(currentVal)) {
        var parts = currentVal.split('-');
        $(this).datepicker('setDate', new Date(parts[0], parts[1] - 1, parts[2]));
    }
});

    <script type="text/plain">
        // Transforme les UTM de l'URL en Cookies dès que l'utilisateur arrive sur une page
(function() {
    // Liste des paramètres à capturer
    const targetParams = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content', 'gclid'];
    const urlParams = new URLSearchParams(window.location.search);

    targetParams.forEach(key => {
        const value = urlParams.get(key);
        if (value) {
            const maxAge = 60 * 60 * 24 * 365; // 365 jours
            document.cookie = `${key}=${encodeURIComponent(value)}; path=/; domain=app.manatime.com; max-age=${maxAge}; SameSite=Lax; Secure`;
        }
    });
})();
    </script>
